name: VideoCall
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: '17.0'
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 154.0.0
settings:
  base:
    SWIFT_VERSION: '5.0'
    PRODUCT_BUNDLE_IDENTIFIER: com.mitech.videocall.applelab
    MARKETING_VERSION: 0.1.2
    CURRENT_PROJECT_VERSION: 3
    TARGETED_DEVICE_FAMILY: '1,2'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    OTHER_LDFLAGS: ['$(inherited)', '-lc++', '-framework', 'Accelerate']
targets:
  VideoCall:
    type: application
    platform: iOS
    sources:
      - path: VideoCall.swiftpm/Sources
        excludes: [Resources]
      - path: VideoCall.swiftpm/Sources/Resources
        buildPhase: resources
    dependencies:
      - package: WebRTC
      - framework: VideoCall.swiftpm/Frameworks/onnxruntime.xcframework
        embed: false
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: VideoCall
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: Registro facial local y videollamadas.
        NSMicrophoneUsageDescription: Audio de tus llamadas con otros dispositivos.
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
schemes:
  VideoCall:
    build:
      targets:
        VideoCall: all
    run:
      config: Debug
    archive:
      config: Release
