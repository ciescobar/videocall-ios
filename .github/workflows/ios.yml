name: Comprobar VideoCall iOS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar sentido vertical en el SDK Apple
        run: |
          python3 - <<'PY'
          import pathlib, subprocess
          sdk = pathlib.Path(subprocess.check_output(['xcrun', '--sdk', 'iphoneos', '--show-sdk-path'], text=True).strip())
          header = sdk / 'System/Library/Frameworks/Vision.framework/Headers/VNObservation.h'
          text = header.read_text()
          assert 'positive angle corresponds to nodding head down direction' in text
          print('PASS: Apple SDK confirms Vision positive pitch means nodding DOWN')
          PY
      - name: Comprobar reglas de captura y espejo
        run: |
          swiftc Apple/VideoCall.swiftpm/Sources/FaceGuidance.swift Apple/Tests/FaceGuidanceChecks.swift -o /tmp/videocall-face-checks
          /tmp/videocall-face-checks
      - name: Preparar XcodeGen
        run: brew install xcodegen
      - name: Generar proyecto
        working-directory: Apple
        run: xcodegen generate --spec project.yml
      - name: Resolver bibliotecas
        working-directory: Apple
        run: xcodebuild -resolvePackageDependencies -project VideoCall.xcodeproj -scheme VideoCall
      - name: Compilar para iPad sin firma
        working-directory: Apple
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project VideoCall.xcodeproj -scheme VideoCall -configuration Debug -destination 'generic/platform=iOS' -derivedDataPath ../build-ios CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-device.log
      - name: Empaquetar IPA sin firma
        shell: bash
        run: |
          mkdir -p unsigned/Payload
          ditto build-ios/Build/Products/Debug-iphoneos/VideoCall.app unsigned/Payload/VideoCall.app
          cd unsigned
          /usr/bin/zip -qry ../MI-DRIVER-iPad-0.1.4-sin-firma.ipa Payload
      - name: Guardar informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Informe-iOS
          path: Apple/*.log
          retention-days: 7
      - name: Guardar IPA pendiente de firma
        uses: actions/upload-artifact@v4
        with:
          name: VideoCall-iOS-sin-firma
          path: MI-DRIVER-iPad-0.1.4-sin-firma.ipa
          retention-days: 7
